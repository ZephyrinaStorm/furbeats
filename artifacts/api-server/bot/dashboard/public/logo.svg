<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3d1f00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a00;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="pawGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)" stroke="#FF8C00" stroke-width="3"/>

  <!-- Paw print - main pad -->
  <ellipse cx="100" cy="120" rx="34" ry="28" fill="url(#pawGrad)" filter="url(#glow)"/>

  <!-- Toe beans -->
  <ellipse cx="66" cy="88" rx="14" ry="16" fill="url(#pawGrad)" filter="url(#glow)"/>
  <ellipse cx="88" cy="76" rx="14" ry="16" fill="url(#pawGrad)" filter="url(#glow)"/>
  <ellipse cx="112" cy="76" rx="14" ry="16" fill="url(#pawGrad)" filter="url(#glow)"/>
  <ellipse cx="134" cy="88" rx="14" ry="16" fill="url(#pawGrad)" filter="url(#glow)"/>

  <!-- Music note overlay -->
  <text x="100" y="130" font-size="22" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="sans-serif" font-weight="bold">♪</text>
</svg>
